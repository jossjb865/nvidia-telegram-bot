name: Run Nvidia Telegram Bot

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # Permite encender el bot manualmente con un botón desde la web de GitHub

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
    - name: Clonar codigo del repositorio
      uses: actions/checkout@v4

    - name: Configurar entorno Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar librerias requeridas
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Ejecutar el bot de Telegram
      env:
        NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      run: python bot.py
